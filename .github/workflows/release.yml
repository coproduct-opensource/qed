# Release: prebuilt binaries with build-provenance attestations, and the
# multi-architecture seller image on ghcr.io, signed keyless with Sigstore,
# with an SBOM and provenance attached. Runs only when a `v*` tag is pushed.
#
# How a seller checks what this publishes (from the repository README):
#   gh attestation verify <binary or archive> --repo coproduct-opensource/qed
#   cosign verify ghcr.io/coproduct-opensource/qed-seller@<digest> \
#     --certificate-identity-regexp '^https://github.com/coproduct-opensource/qed/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/coproduct-opensource/qed-seller@<digest> --repo coproduct-opensource/qed
#
# Authentication: the workflow's own GITHUB_TOKEN (ghcr push, release) and its
# OIDC identity (Sigstore signing, attestations). No stored secrets.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # macos-14 on arm64 was withdrawn: the v0.1.0 tag's run was refused
          # with "The configuration 'macos-14-arm64-us-default' is not
          # supported" (2026-11-13). package.yml builds the same matrix on
          # pull requests, so a runner change shows before a tag.
          - runner: macos-15
            target: aarch64-apple-darwin
            host_features: ""
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            host_features: "--features in-process-prover"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            host_features: "--features in-process-prover"
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      RISC0_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: build agents
        run: cargo build --locked --release --manifest-path contracts/agents/Cargo.toml --bins
      - name: build prover host
        run: cargo build --locked --release --manifest-path contracts/proof-acceptance/zkvm/Cargo.toml -p nucleus-acceptance-host ${{ matrix.host_features }}
      - name: package
        run: |
          mkdir -p dist/qed-${{ matrix.target }}
          for b in nucleus-seller nucleus-buyer nucleus-vault-ops nucleus-fixture-prover qed-wrap qed-groth16-data nucleus-acceptance-host; do
            cp "target/release/$b" "dist/qed-${{ matrix.target }}/"
          done
          tar -C dist -czf "dist/qed-${{ matrix.target }}.tar.gz" "qed-${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qed-${{ matrix.target }}
          path: dist/qed-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: release and attest binaries
    # After the image index, so the release notes can name its digest.
    needs: [binaries, image-index]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qed-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum qed-*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/qed-*.tar.gz"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image-index.outputs.image }}
          DIGEST: ${{ needs.image-index.outputs.digest }}
        run: >-
          gh release create "$TAG" dist/qed-*.tar.gz dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag
          --notes "Prebuilt binaries. Check each archive with gh attestation verify ARCHIVE --repo $GITHUB_REPOSITORY and sha256sum -c SHA256SUMS. Seller image: $IMAGE@$DIGEST (check it by this digest with cosign verify and gh attestation verify, as the README says)."

  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/qed-seller,push-by-digest=true,name-canonical=true,push=true
      # One digest per platform, passed on as a file: a matrix job has one
      # set of outputs, written by whichever leg finishes last.
      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digest && printf "%s" "$DIGEST" > "digest/${{ matrix.slug }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: digest/${{ matrix.slug }}
          if-no-files-found: error

  image-index:
    name: image index, signature and provenance
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/qed-seller
      TAG: ${{ github.ref_name }}
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/qed-seller
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: index
        name: create the multi-architecture index
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE@$(cat digest/amd64)" "$IMAGE@$(cat digest/arm64)"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign the index by digest (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
