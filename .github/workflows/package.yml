# Pull requests: build the seller image for both architectures, publishing
# nothing, and run the amd64 image's prover host once. Catches a broken
# Containerfile before a tag does; the release binaries are first built by
# release.yml itself.
name: package

on:
  pull_request:

permissions: {}

jobs:
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: qed-seller:pr
      - name: the image runs and its binaries answer
        if: matrix.platform == 'linux/amd64'
        run: |
          docker buildx build --load -t qed-seller:pr -f Containerfile .
          docker run --rm --entrypoint /usr/local/bin/nucleus-acceptance-host qed-seller:pr order2-image
