[package]
name = "qed-verify"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Rebuilds QED's deployed contracts from committed source with pinned compiler settings and compares them with the chain: runtime code, creation code and constructor arguments, metadata hash, and upgrade controls. Plain JSON-RPC, no keys."

[workspace]

[[bin]]
name = "qed-verify"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = { version = "0.10.9", default-features = false }
sha3 = { version = "0.10.8", default-features = false }
# JSON-RPC, the pinned compiler download and Sourcify. The same client the
# agents and the site use.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
