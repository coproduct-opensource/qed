[package]
name = "nucleus-acceptance-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Embed the second-form program (program/nucleus-vault-acceptance.bin) and
# serve the `vault-` commands. Off by default: that file is not part of a
# public release (its build embeds local build paths), and a tree without it
# must still build.
second-form = []
# Prove in this process instead of through an installed r0vm. For Linux, where
# it needs no Metal toolchain and where RISC Zero publishes no r0vm for arm64
# (the v3.1.0 release carries macOS arm64 and Linux x86-64 only). The seller
# image is built with it.
in-process-prover = ["risc0-zkvm/prove"]

[dependencies]

# The host carries the published program binary and does not build the guest:
# a seller needs no RISC-V toolchain. `methods` rebuilds it from source and
# its test compares the result with the published file.
# No `prove` feature: proving and execution go to the installed r0vm 3.1.0
# binary over IPC. In-process proving needs the Xcode Metal toolchain to build.
risc0-zkvm = { version = "=3.1.0" }
# The Groth16 step in Rust, in place of the x86 prover container.
nucleus-groth16-native = { path = "../groth16-native" }
# `verify-programs`: wrap a rebuilt user ELF with RISC Zero's kernel exactly as
# risc0-build does, to compute the image ID a published binary would have.
# (Also used by the tests to split a published binary.)
risc0-binfmt = { version = "=3.0.6" }
risc0-zkos-v1compat = { version = "=2.2.3" }
