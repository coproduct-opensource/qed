# The Lean checker recurses deeply; the native host runs it on a 64 MiB
# thread. A wasm module has one stack, fixed at link time.
#
# Panic locations embed source paths. The published module is built with
# RUSTFLAGS carrying this same link argument plus --remap-path-prefix for the
# checkout, the cargo registry and the toolchain (RUSTFLAGS replaces this
# table, so the link argument must be repeated there); the recipe is in
# docs/rfcs/qed-site-2026-11-13.md. The site's tests refuse a module that
# names a home directory.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=67108864"]
